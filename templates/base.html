<!DOCTYPE html>
<html lang="ru" class="{{ 'dark' if request.cookies.get('theme') == 'dark' else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Онлайн Казино с Промокодами{% endblock %}</title>
    <script>
        // JavaScript для переключения темы
        function toggleTheme() {
            const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            document.documentElement.classList.toggle('dark', newTheme === 'dark');
            document.documentElement.classList.toggle('light', newTheme === 'light');

            // Сохраняем тему в cookie
            document.cookie = `theme=${newTheme}; path=/; max-age=31536000`; // 1 год

            // Обновляем иконку кнопки
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const themeButton = document.getElementById('theme-toggle');
            if (!themeButton) return;

            const isDark = document.documentElement.classList.contains('dark');
            const iconContainer = themeButton.querySelector('svg');

            if (isDark) {
                // Темная тема активна, показываем иконку солнца (переключение к светлой)
                iconContainer.innerHTML = `
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                `;
            } else {
                // Светлая тема активна, показываем иконку луны (переключение к темной)
                iconContainer.innerHTML = `
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                `;
            }
        }

        // Устанавливаем тему при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем сохраненную тему в cookie
            const cookies = document.cookie.split(';');
            let savedTheme = null;
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'theme') {
                    savedTheme = value;
                    break;
                }
            }

            if (savedTheme) {
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(savedTheme);
            } else {
                // Если тема не сохранена, определяем по системным настройкам
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const initialTheme = prefersDark ? 'dark' : 'light';
                document.documentElement.classList.add(initialTheme);
            }

            // Обновляем иконку темы
            updateThemeIcon();
        });
    </script>
    <style>
        /* Основные стили */
        :root {
            --bg-primary: #f9fafb;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .dark:root {
            --bg-primary: #111827;
            --bg-secondary: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --card-bg: #1f2937;
            --accent-primary: #60a5fa;
            --accent-hover: #3b82f6;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        header {
            text-align: center;
            position: relative;
            margin-bottom: 3rem;
            padding-top: 1rem;
        }

        .header-content {
            position: relative;
            z-index: 10;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            padding: 0.5rem;
            border-radius: 50%;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .theme-toggle:hover {
            background-color: #e5e7eb;
            transform: scale(1.05);
        }

        .dark .theme-toggle:hover {
            background-color: #374151;
        }

        .theme-toggle svg {
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        @media (min-width: 640px) {
            h1 {
                font-size: 2.25rem;
            }
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            max-width: 2xl;
            margin: 0 auto;
        }

        .casino-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 640px) {
            .casino-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1024px) {
            .casino-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .casino-card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            box-shadow: var(--card-shadow);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .casino-card:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            text-decoration: none;
        }

        .casino-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .casino-image {
            width: 4rem;
            height: 4rem;
            background-color: #e5e7eb;
            border: 2px dashed #d1d5db;
            border-radius: 0.75rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
        }

        .dark .casino-image {
            background-color: #374151;
            border-color: #4b5563;
            color: #6b7280;
        }

        .casino-info {
            flex: 1;
        }

        .casino-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .casino-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .casino-stats {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .casino-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: #fbbf24;
        }

        .divider {
            color: var(--border-color);
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .category-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background-color: #dbeafe;
            color: #1d4ed8;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .dark .category-tag {
            background-color: #1e3a8a;
            color: #bfdbfe;
        }

        .platform-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .platform-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background-color: #d1fae5;
            color: #065f46;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .dark .platform-tag {
            background-color: #064e3b;
            color: #a7f3d0;
        }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            padding: 0.5rem;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background-color: #e5e7eb;
            color: #374151;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
        }

        .filter-btn:hover {
            background-color: #d1d5db;
            text-decoration: none;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
        }

        .dark .filter-btn {
            background-color: #374151;
            color: #d1d5db;
        }

        .dark .filter-btn:hover {
            background-color: #4b5563;
        }

        .dark .filter-btn.active {
            background-color: #60a5fa;
            color: #1f2937;
        }

        .platform-navigation {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .platform-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
            text-decoration: none;
        }

        .platform-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
            text-decoration: none;
        }

        .platform-btn.active {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
            text-decoration: none;
        }

        .search-container {
            margin-bottom: 2rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1rem;
            padding-left: 2.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .bonus-card {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #bfdbfe;
            transition: all 0.2s ease;
        }

        .dark .bonus-card {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            border-color: #1e40af;
        }

        .bonus-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .bonus-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .bonus-details {
            flex: 1;
        }

        .bonus-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .bonus-type {
            padding: 0.25rem 0.75rem;
            background-color: #dbeafe;
            color: #1d4ed8;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .dark .bonus-type {
            background-color: #1e40af;
            color: #bfdbfe;
        }

        .bonus-expiration {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .bonus-code {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0.25rem 0;
        }

        .bonus-description {
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .bonus-requirements {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .copy-btn {
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            align-self: flex-start;
        }

        @media (min-width: 640px) {
            .copy-btn {
                align-self: center;
            }
        }

        .copy-btn:hover {
            background-color: #2563eb;
            transform: scale(1.02);
        }

        .dark .copy-btn {
            background-color: #60a5fa;
        }

        .dark .copy-btn:hover {
            background-color: #3b82f6;
        }

        .info-box {
            background-color: var(--bg-secondary);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .info-section {
            margin-bottom: 1.5rem;
        }

        .info-section:last-child {
            margin-bottom: 0;
        }

        .info-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .info-content {
            color: var(--text-secondary);
        }

        .payment-methods {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .payment-method {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background-color: #dbeafe;
            color: #1d4ed8;
            border-radius: 9999px;
            font-size: 0.875rem;
        }

        .dark .payment-method {
            background-color: #1e40af;
            color: #bfdbfe;
        }

        .cta-button {
            width: 100%;
            display: block;
            text-align: center;
            padding: 0.75rem 1rem;
            background-color: #10b981;
            color: white;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            background-color: #059669;
            transform: scale(1.02);
        }

        .dark .cta-button {
            background-color: #34d399;
            color: #1f2937;
        }

        .dark .cta-button:hover {
            background-color: #10b981;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: #3b82f6;
            text-decoration: none !important;
            margin-bottom: 1.5rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .dark .back-link {
            color: #60a5fa;
        }

        .back-link:hover {
            color: #2563eb;
            text-decoration: none !important;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
        }

        .no-results p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .reset-filter {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            color: white;
            border-radius: 0.375rem;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .reset-filter:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
